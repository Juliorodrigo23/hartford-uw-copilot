# Cloud Build → Artifact Registry → Cloud Run
# Run: gcloud builds submit --config cloudbuild.yaml

substitutions:
  _REGION: us-central1
  _REPO: uw-copilot
  _SERVICE: uw-copilot-backend
  _VERTEX_MODEL: gemini-2.0-pro-exp-02-05
  _VERTEX_FAST_MODEL: gemini-2.0-flash

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest
      - --file=Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=2
      - --concurrency=10
      - --timeout=300s
      - --min-instances=0
      - --max-instances=3
      - --service-account=uw-copilot-runner@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCP_LOCATION=${_REGION},VERTEX_MODEL=${_VERTEX_MODEL},VERTEX_FAST_MODEL=${_VERTEX_FAST_MODEL},ALLOW_UNSIGNED_DEV=false
      - --set-secrets=HMAC_SECRET=hmac-secret:latest,OPENAI_API_KEY=openai-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest
