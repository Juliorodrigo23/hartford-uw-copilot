# Cloud Build → Artifact Registry → Cloud Run
# Run: gcloud builds submit --config cloudbuild.yaml

substitutions:
  _REGION: us-central1
  _REPO: uw-copilot
  _SERVICE: uw-copilot-backend
  _VERTEX_LOCATION: global
  _VERTEX_MODEL: gemini-3.8-flash
  _VERTEX_FAST_MODEL: gemini-3.5-flash-lite
  _GEMINI_AUTH_MODE: api_key
  _GEMINI_API_BACKEND: developer

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      # Bake the embedding + reranker models into the image: with a populated
      # dense index, the first query would otherwise download ~1.4GB from
      # HuggingFace at request time on a cold container.
      - --build-arg=PREFETCH_MODELS=1
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest
      - --file=Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID
      - --platform=managed
      - --allow-unauthenticated
      # 4Gi: bge-large + torch live in-process once dense retrieval is active
      - --memory=4Gi
      - --cpu=2
      # Full CPU during container start → faster model warmup on cold boot
      - --cpu-boost
      # Cold imports plus retrieval warmup can exceed four minutes on a new
      # host. Keep traffic gated on warm models with a six-minute allowance.
      - --startup-probe=httpGet.path=/ready,periodSeconds=10,timeoutSeconds=5,failureThreshold=36
      - --concurrency=10
      - --timeout=300s
      # min-instances=1 keeps one warm instance (no cold start + models
      # pre-loaded when a reviewer opens the demo). Costs a few tens of
      # $/month at 4Gi — dial back to 0 after the interview cycle.
      - --min-instances=1
      - --min=1
      - --max-instances=3
      - --service-account=uw-copilot-runner@$PROJECT_ID.iam.gserviceaccount.com
      # Preserve independently configured optional monitoring on later deploys.
      - --update-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCP_LOCATION=${_VERTEX_LOCATION},VERTEX_MODEL=${_VERTEX_MODEL},VERTEX_FAST_MODEL=${_VERTEX_FAST_MODEL},GEMINI_AUTH_MODE=${_GEMINI_AUTH_MODE},GEMINI_API_BACKEND=${_GEMINI_API_BACKEND},ALLOW_UNSIGNED_DEV=false,CRITIQUE_PROVIDER=auto,WARM_RAG_MODELS=true
      # HMAC for proxy auth, OpenAI key for cross-family runtime critique (CRITIQUE_PROVIDER=auto
      # uses GPT-4o when present, otherwise falls back to Gemini Flash).
      - --update-secrets=HMAC_SECRET=hmac-secret:latest,OPENAI_API_KEY=openai-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest
